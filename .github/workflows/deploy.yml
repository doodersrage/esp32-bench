name: Deploy

# Builds the site and deploys it to Cloudflare Workers on every push to main,
# then tells IndexNow search engines about the pages.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until they are set, the deploy step is skipped and the run still passes.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: Log each Cloudflare API call (tokens stay redacted)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            monitor/package-lock.json

      - name: Install
        run: |
          npm ci
          npm install --global cf@1.0.0-beta.30

      - name: Build
        run: npx astro build

      - name: Test the site's libraries
        run: |
          node --experimental-strip-types tests/share.test.ts
          node scripts/test-tools.mjs
          node --experimental-strip-types scripts/test-search.mjs

      - name: Test the report API
        working-directory: api
        run: |
          npm ci
          node --experimental-strip-types test/report.test.ts
          node --experimental-strip-types test/turnstile.test.ts

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEBUG: ${{ inputs.debug && '1' || '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to deploy from GitHub."
            exit 0
          fi
          cf deploy dist --message "${GITHUB_SHA::7}: $(git log -1 --format=%s | head -c 80)"
          node scripts/indexnow.mjs || echo "::warning title=IndexNow::Submission failed; the site is deployed."

      - name: Deploy the report API
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEBUG: ${{ inputs.debug && '1' || '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          # REPORT_TO is a Worker secret set once with --secrets-file; deploys keep it.
          cf deploy --message "${GITHUB_SHA::7}: $(git log -1 --format=%s | head -c 80)"

      - name: Deploy the uptime monitor
        working-directory: monitor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEBUG: ${{ inputs.debug && '1' || '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then exit 0; fi
          npm ci
          node --experimental-strip-types test/checks.test.ts
          # ALERT_TO is a Worker secret set once with --secrets-file; deploys keep it.
          cf deploy --message "${GITHUB_SHA::7}: $(git log -1 --format=%s | head -c 80)"
