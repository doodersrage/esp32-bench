name: Deploy

# Builds the site and deploys it to Cloudflare Workers on every push to main,
# then tells IndexNow search engines about the pages.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until they are set, the deploy step is skipped and the run still passes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          npm ci
          npm install --global cf@1.0.0-beta.30

      - name: Build
        run: npx astro build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to deploy from GitHub."
            exit 0
          fi
          cf deploy dist --message "${GITHUB_SHA::7}: $(git log -1 --format=%s | head -c 80)"
          node scripts/indexnow.mjs || echo "::warning title=IndexNow::Submission failed; the site is deployed."
