name: Firmware library

# Builds prebuilt firmware for every library project on every board it lists
# and publishes it to https://fw.esp32bench.dev/ (an R2 bucket, written through
# the site's API with this workflow's OIDC token; no secrets needed).
# Runs weekly on Tuesday, after Monday's weekly check, by hand, and when the
# projects or the build scripts change. If any sketch fails to compile, nothing
# is uploaded: the library keeps its last good state.
on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/data/projects.ts
      - src/data/probeharbor.ts
      - scripts/build-firmware-library.mjs
      - scripts/upload-firmware-library.mjs
      - scripts/lib/sketch-build.mjs
      - scripts/emulate-firmware.mjs
      - .github/workflows/firmware-library.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: firmware-library
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pioarduino-${{ hashFiles('scripts/lib/sketch-build.mjs') }}
          restore-keys: pioarduino-

      - name: Install
        run: |
          npm ci
          pip install platformio

      - name: Build the site with the sketch export
        run: DUMP_SKETCHES=1 npx astro build

      - name: Compile and merge every project for every board
        run: node scripts/build-firmware-library.mjs

      # Espressif's QEMU boots each ESP32 and ESP32-C3 image and checks its serial
      # output (scripts/emulate-firmware.mjs). Report only for now: the results go
      # in the job summary and nothing here blocks publishing.
      - name: Boot the images in QEMU
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libslirp0 libsdl2-2.0-0 libpixman-1-0 libgcrypt20 libglib2.0-0 > /dev/null
          mkdir -p .qemu
          for arch in xtensa riscv32; do
            gh release download -R espressif/qemu esp-develop-9.2.2-20261109 -D .qemu -p "qemu-$arch-softmmu-*-x86_64-linux-gnu.tar.xz"
            tar xf .qemu/qemu-$arch-softmmu-*-x86_64-linux-gnu.tar.xz -C .qemu
          done
          QEMU_DIR=.qemu/qemu node scripts/emulate-firmware.mjs

      - name: Publish to fw.esp32bench.dev
        run: |
          token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.esp32bench.dev" | jq -r .value)"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error title=No OIDC token::Could not get an id token for the upload."
            exit 1
          fi
          FW_UPLOAD_TOKEN="$token" node scripts/upload-firmware-library.mjs
