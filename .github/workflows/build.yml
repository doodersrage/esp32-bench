name: Build

# Installs dependencies, builds the site and runs every test suite on every push
# and on pull requests, including ones from forks. It only reads the repository
# and uses no secrets, so it is safe to run on other people's changes.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm ls astro esp-web-tools --depth=0

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      # Surface the end of the build log as an annotation so a failure can be
      # read from the checks API without downloading logs.
      - name: Report build failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg="$(tail -c 5000 build.log | sed 's/\x1b\[[0-9;]*m//g')"
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\n'/'%0A'}"
            msg="${msg//$'\r'/'%0D'}"
            echo "::error title=astro build failed::$msg"
          fi

      - name: Test the wiring diagrams and kit cards against every project
        run: |
          DUMP_WIRING=1 DUMP_KIT=1 npx astro build > /dev/null
          node --experimental-strip-types tests/wiring-diagram.test.ts
          node --experimental-strip-types tests/kit.test.ts

      - name: Type check
        run: |
          npm install --no-save @astrojs/check typescript@6
          npx astro check

      - name: Test the site's libraries
        run: |
          node --experimental-strip-types tests/share.test.ts
          node --experimental-strip-types tests/previews.test.ts
          node --experimental-strip-types tests/lab-expect.test.ts
          node --experimental-strip-types tests/settings.test.ts
          node --experimental-strip-types tests/editor.test.ts
          node --experimental-strip-types tests/flash-hook.test.ts
          node --experimental-strip-types tests/library-elf.test.ts
          bash tests/settings-snippet/run.sh
          node scripts/test-tools.mjs
          node --experimental-strip-types scripts/test-search.mjs

      # GitHub's Ubuntu runners come with google-chrome.
      - name: Load every kind of page in a browser
        run: node scripts/smoke-pages.mjs

      - name: Test the report API and the monitor
        run: |
          (cd api && npm ci && node --experimental-strip-types test/report.test.ts && node --experimental-strip-types test/turnstile.test.ts && node --experimental-strip-types test/builds.test.ts && node --experimental-strip-types test/oidc.test.ts && node --experimental-strip-types test/lab.test.ts)
          (cd lab && pip install -q -r requirements.txt && python3 -m unittest discover -s tests)
          (cd monitor && npm ci && node --experimental-strip-types test/checks.test.ts)
          (cd compile && npm ci && node --experimental-strip-types test/shared.test.ts)

      - name: List built pages
        run: find dist -name '*.html' | sort
