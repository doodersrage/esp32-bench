; Pin detective: helper firmware for the Detective page.
; It reports which header pad is being touched to ground, and what chip it is
; running on. One image per chip family.
;
; Build and publish the images: node scripts/build-firmware.mjs
; The ESP32, S3 and C3 envs use the platform pin and settings of ProbeHarbor's
; probe firmware, which has been flashed and run on all three boards. They stay
; on that pin so their images do not change. The S2 and C6 envs need Arduino
; core 3.x (core 2.0.x cannot build for the C6), so they use a pinned pioarduino
; release. Their images have not been run on hardware.

[platformio]
; Plain `pio run` builds the core 2 group only. The S2 and C6 need their own
; PlatformIO home (packages clash with 7.1.3); build them with
; node scripts/build-firmware.mjs, or `pio run -e esp32s2 -e esp32c6` with
; PLATFORMIO_CORE_DIR pointing at a separate home.
default_envs = esp32, esp32s3, esp32c3

[env]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
; The DevKitC default assumes 8 MB flash; build for 4 MB so smaller modules boot too.
board_upload.flash_size = 4MB
board_build.partitions = default.csv

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
  ; Turn on the chip's own USB port (DevKitM-1 leaves it off).
  -DARDUINO_USB_MODE=1

; Arduino core 3.x, pinned to a pioarduino release.
[core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip

[env:esp32s2]
platform = ${core3.platform}
board = esp32-s2-saola-1
build_flags =
  ; Serial is the native USB port; the console also talks on UART0 (Serial0),
  ; so both of the DevKitC-1's ports work.
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6]
platform = ${core3.platform}
board = esp32-c6-devkitc-1
; The DevKitC-1 has 8 MB on most modules; build for 4 MB so smaller ones boot too.
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  ; Serial is the USB serial/JTAG port; the console also talks on UART0 (Serial0),
  ; the port behind the board's UART bridge.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
